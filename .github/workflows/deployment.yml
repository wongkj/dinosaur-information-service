name: Deploy to the Dev Environment

on:
  workflow_call:
    inputs:
      deploy-github-env:
        required: true
        type: string
      aws-region:
        required: false
        type: string
        default: "ap-southeast-2"
  workflow_dispatch:
    inputs:
      deploy-github-env:
        description: "GitHub environment to deploy to"
        required: true
        type: environment
      aws-region:
        description: "AWS region to deploy to"
        required: false
        type: string
        default: "ap-southeast-2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Run Tests
        run: npm run test
